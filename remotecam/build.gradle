plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.grigor.camlink'
    compileSdk 34

    defaultConfig {
        applicationId 'com.grigor.camlink'
        minSdk 23
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // Same permanent key as Disco Lights, so new builds install over old ones.
    signingConfigs {
        camlink {
            storeFile file('../app/disco.jks')
            storePassword 'swdhP4TiMFFLqdcx1fJ4EI'
            keyAlias 'disco'
            keyPassword 'swdhP4TiMFFLqdcx1fJ4EI'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.camlink
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
