name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk DiscoLights.apk
          jq -n --argjson code "$GITHUB_RUN_NUMBER" --arg notes "$(git log -1 --pretty=%s)" \
            '{versionCode: $code, notes: $notes}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: DiscoLights
          path: DiscoLights.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Disco Lights (latest build)
          make_latest: true
          overwrite_files: true
          files: |
            DiscoLights.apk
            version.json
