plugins {
    id 'com.android.application'
}

// GitHub's build number becomes the app version, so every push is a newer version.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.grigor.disco'
    compileSdk 34

    defaultConfig {
        applicationId 'com.grigor.disco'
        minSdk 23
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // One permanent key, so new builds install as updates over old ones.
    signingConfigs {
        disco {
            storeFile file('disco.jks')
            storePassword 'swdhP4TiMFFLqdcx1fJ4EI'
            keyAlias 'disco'
            keyPassword 'swdhP4TiMFFLqdcx1fJ4EI'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.disco
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
